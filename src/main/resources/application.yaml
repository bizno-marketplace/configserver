server:
  port: 8888
spring:
  application:
    name: configserver
  cloud:
    config:
      server:
        git:
          uri: ${GIT_CONFIG_URI:https://github.com/bizno-marketplace/bizno-configs}
          search-paths: '{application}'
          default-label: master
          clone-on-start: true

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    preferIpAddress: true

management:
  server:
    port: 9888

  endpoints:
    web:
      exposure:
        include: health,refresh,info,prometheus,gateway

  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

  tracing:
    sampling:
      probability: 1.0

  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:14318/v1/metrics}

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:14318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:14318/v1/logs}
      pattern:
        correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
      include:
        - application-name
        - traceId
        - spanId