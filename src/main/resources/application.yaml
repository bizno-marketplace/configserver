server:
  port: 8888
spring:
  application:
    name: configserver
  cloud:
    config:
      server:
        git:
          uri: ${GIT_CONFIG_URI:https://github.com/bizno-marketplace/bizno-configs}
          search-paths: '{application}'
          default-label: master
          clone-on-start: true

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    preferIpAddress: true

management:
  server:
    port: 9888
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://localhost:9411}/api/v2/spans

loki:
  url: ${LOKI_URL:http://localhost:3100}