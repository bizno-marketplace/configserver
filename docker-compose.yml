services:
  config-server:
    build: .
    image: bizno/config-server:local
    container_name: config-server
    restart: unless-stopped
    environment:
      - DISCOVERY_SERVER_URL=http://discovery-server:8761/eureka/
    ports:
      - "8888:8888"   # main port
      - "9888:9888"   # management port
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - bizno-net
    # IMPORTANTE: sobe o discovery-server primeiro (docker compose separado).
    # depends_on não funciona entre stacks/ficheiros diferentes.

networks:
  bizno-net:
    external: true